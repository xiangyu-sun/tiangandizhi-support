name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Do not include personal information in screenshots or descriptions.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS (iPhone)
        - iPadOS (iPad)
        - macOS
        - watchOS
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version
      placeholder: "e.g. iOS 18.4 / macOS 15.2"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App Version
      placeholder: "e.g. 2.55.0 — find it in Settings"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Navigate to...
        3. See error
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots welcome.
